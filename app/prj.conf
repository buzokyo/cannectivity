# This is using the deprecated USB device stack
CONFIG_DEPRECATION_TEST=y

CONFIG_LOG=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_GS_USB_LOG_LEVEL_WRN=y
CONFIG_CANNECTIVITY_LOG_LEVEL_WRN=y

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_BOS=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# Prioritize USB-host CAN transmissions over ordinary application work.
# RX/TX FIFO and CAN controller arbitration remain unchanged.
CONFIG_USB_DEVICE_GS_USB_TX_THREAD_PRIO=-2
